# Book-mastery follows main, refreshed weekly or with chezmoi update.

[".claude/skills/book-mastery"]
    type = "archive"
    url = "https://github.com/fjuniorr/book-mastery-skill/archive/refs/heads/main.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

[".codex/skills/book-mastery"]
    type = "archive"
    url = "https://github.com/fjuniorr/book-mastery-skill/archive/refs/heads/main.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

# Native marketplaces use their upstream manifests and complete, pinned source trees.
{{ range .agentPlugins }}
[".local/share/agent-plugin-sources/{{ .directory }}"]
    type = "archive"
    url = "https://github.com/{{ .repository }}/archive/{{ .revision }}.tar.gz"
    exact = true
    stripComponents = 1
{{ end }}
