# Book-mastery follows main, refreshed weekly or with chezmoi update.

[".claude/skills/book-mastery"]
    type = "archive"
    url = "https://github.com/fjuniorr/book-mastery-skill/archive/refs/heads/main.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

[".codex/skills/book-mastery"]
    type = "archive"
    url = "https://github.com/fjuniorr/book-mastery-skill/archive/refs/heads/main.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

# Shared collections are pinned; keep source trees for relative references and scripts.
{{ range .agentSkills }}
[".local/share/agent-skill-sources/{{ .namespace }}"]
    type = "archive"
    url = "https://github.com/{{ .repository }}/archive/{{ .revision }}.tar.gz"
    exact = true
{{ if .subtree }}
    stripComponents = 2
    include = ["*/{{ .subtree }}/**"]
{{ else }}
    stripComponents = 1
{{ end }}
{{ end }}
