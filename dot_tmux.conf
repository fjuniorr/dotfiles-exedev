set -g mouse on

# Forward OSC 52 clipboard writes from programs inside tmux out to the
# terminal emulator, so osc52() in dotfiles/functions.sh (and anything else
# that copies this way) reaches the clipboard of the machine you're sitting
# at. The default `external` only lets tmux itself do that, not its children.
set -g set-clipboard on

# Status bar: deliberately quiet. No plugins or tpm — this has to work on
# a fresh VM with nothing but tmux installed. `bg=default` inherits the
# terminal background so the bar blends in instead of sitting on top of
# the pane as a coloured slab (tmux's green default).
set -g status-style "bg=default,fg=colour245"
set -g status-position bottom
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 40

set -g status-left " #[fg=colour250]#S#[fg=colour240] │ "
set -g status-right "#[fg=colour240]%H:%M "

setw -g window-status-format "#[fg=colour240]#I:#W"
setw -g window-status-current-format "#[fg=colour252,bold]#I:#W"
setw -g window-status-separator "  "

# Keep the rest of the chrome as quiet as the bar.
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour243"
set -g message-style "bg=default,fg=colour252"
